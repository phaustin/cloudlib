[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cloudlib"
description = "atsc405 code"
authors = [
  { name="Philip Austin", email="paustin@eoas.ubc.ca" },
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "pytz",
  "requests",
  "beautifulsoup4",   # soundings.wyominglib (imported as bs4)
  "psutil",           # killprocs / killjobs scripts
  "netCDF4",          # pyncdump script
]

[project.optional-dependencies]
# installed by Read the Docs (see .readthedocs.yaml)
docs = [
  "sphinx>=7.4,<8",
  "myst-parser>=3.0,<4",
  "sphinx-rtd-theme",
]

[project.scripts]
killprocs = "cloudlib.utils.killprocs:main"
killjobs = "cloudlib.utils.killjobs:main"
pyncdump = "cloudlib.utils.ncdump:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/cloudlib/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
authors = ["Phil Austin <paustin@eos.ubc.ca>"]
name = "cloudlib"
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = "*"
numpy = "*"
scipy = "*"
pip = "*"
zarr = "*"
git = "*"
jupyterlab = "*"
jupyterlab-myst = "*"
jupytext = "*"
pythia-datasets = "*"
metpy = "*"
netcdf4 = "*"
hatch = "*"
ghp-import = "*"
pytz = "*"
jupyter-book = "<2"
mystmd = "*"
sphinx_rtd_theme = ">=3.1.0,<4"
sphinx = ">=7.4.7,<8"
myst-parser = ">=3.0.1,<4"

[tool.pixi.pypi-dependencies]
cloudlib = { path = ".", editable = true }


