[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cloudlib"
description = "atsc405 code"
authors = [
  { name="Philip Austin", email="paustin@eoas.ubc.ca" },
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "pytz",
  "requests",
  "beautifulsoup4",   # soundings.wyominglib (imported as bs4)
]
# gen_utils (helper_funs) is a run dependency too, but it is only on the
# eoas_ubc conda channel, not PyPI, so it is declared in recipe/recipe.yaml
# and [tool.pixi.dependencies] instead of here.

[project.optional-dependencies]
# installed by Read the Docs (see .readthedocs.yaml)
docs = [
  "sphinx>=7.4,<8",
  "myst-parser>=3.0,<4",
  "sphinx-rtd-theme",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudlib"]

[tool.hatch.build.hooks.vcs]
version-file = "src/cloudlib/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge", "eoas_ubc"]
platforms = ["osx-arm64", "linux-64", "win-64"]
authors = ["Phil Austin <paustin@eos.ubc.ca>"]
name = "cloudlib"
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = "*"
numpy = "*"
scipy = "*"
pip = "*"
zarr = "*"
git = "*"
jupyterlab = "*"
jupyterlab-myst = "*"
jupytext = "*"
pythia-datasets = "*"
metpy = "*"
netcdf4 = "*"
hatch = "*"
ghp-import = "*"
pytz = "*"
jupyter-book = "<2"
mystmd = "*"
myst-parser = ">=3.0.1,<4"
typst = ">=0.15.1,<0.16"
gen_utils = ">=0.3.1,<0.4"
pytest = "*"
rattler-build = "*"
setuptools_scm = "*"
anaconda-auth = "*"

[tool.pixi.tasks]
build-conda = "rm -rf output && rattler-build build --recipe recipe/recipe.yaml --output-dir output -c conda-forge -c eoas_ubc"

[tool.pixi.pypi-dependencies]
cloudlib = { path = ".", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]


